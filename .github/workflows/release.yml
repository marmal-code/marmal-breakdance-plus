# Vydání nové verze pluginu.
# Spustí se:
#  a) odesláním tagu vX.Y.Z (Release vytvoří akce sama), nebo
#  b) ručním vydáním Release na GitHubu (akce jen přiloží ZIP).
# Weby si aktualizaci stáhnou z ZIPu přiloženého k Release.
name: Vydání verze (ZIP pro aktualizace)

on:
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kontrola, že verze v pluginu odpovídá tagu
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep -m1 -E '^\s*\*\s*Version:' marmal-breakdance-plus.php | sed -E 's/.*Version:\s*//' | tr -d '[:space:]')
          CONST=$(grep -m1 "MARMAL_BDP_VERSION'" marmal-breakdance-plus.php | sed -E "s/.*, '([^']+)'.*/\1/")
          echo "Tag: $TAG / Version: $VERSION / MARMAL_BDP_VERSION: $CONST"
          if [ "$TAG" != "$VERSION" ] || [ "$TAG" != "$CONST" ]; then
            echo "::error::Tag ($TAG) neodpovídá Version ($VERSION) nebo MARMAL_BDP_VERSION ($CONST). Oprav verzi a vydej znovu."
            exit 1
          fi

      - name: Sestavení ZIPu
        run: |
          mkdir -p dist/marmal-breakdance-plus
          rsync -a ./ dist/marmal-breakdance-plus/ \
            --exclude '.git' --exclude '.github' --exclude 'dist' \
            --exclude '.gitignore' --exclude '.gitattributes' --exclude '.DS_Store'
          cd dist && zip -rq marmal-breakdance-plus.zip marmal-breakdance-plus

      - name: Vytvoření Release (pokud ještě neexistuje) a přiložení ZIPu
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "${GITHUB_REF_NAME#v}" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/marmal-breakdance-plus.zip --clobber
